# Findings go only to Slack: run pages, logs and artifacts of a public repository are visible to anyone.
name: Production vulnerability scan
on:
  schedule:
    - cron: "0 5 * * 1" # At 05:00 on Monday
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/production-scan.yml

env:
  AWS_REGION: eu-north-1
  ECR_REGISTRY: 095341522062.dkr.ecr.eu-north-1.amazonaws.com
  TRIVY: aquasec/trivy:0.75.0

permissions:
  id-token: write
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE }}
          role-duration-seconds: 1200

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2
        with:
          mask-password: 'true'

      - name: Scan production images
        run: |
          mkdir results
          for repository in service api-gateway frontend; do
            image="$ECR_REGISTRY/oppivelvollisuus/$repository:env-prod"
            docker pull --quiet "$image"
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/work" -w /work "$TRIVY" \
              image --scanners vuln --ignore-unfixed --no-progress --quiet --format json --output result.json "$image"
            jq --arg repository "$repository" '.ArtifactName = $repository' result.json > "results/$repository.json"
          done

      - name: Compose Slack message
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRODUCTION_COMMIT=$(jq -r '.Metadata.ImageConfig.config.Labels["fi.espoo.commit"] // empty' results/*.json | sort -u | head -1)
          COMMITS_NOT_IN_PRODUCTION=$(gh api "repos/$GITHUB_REPOSITORY/compare/$PRODUCTION_COMMIT...master" --jq .ahead_by)

          jq -s '[.[] | .ArtifactName as $image | .Results[]?.Vulnerabilities[]?
                  | select(.Severity == "CRITICAL" or .Severity == "HIGH")
                  | {Severity, PkgName, InstalledVersion, FixedVersion, VulnerabilityID, image: $image}]
                 | group_by([.Severity, .PkgName, .InstalledVersion, .VulnerabilityID])
                 | map(.[0] + {images: (map(.image) | unique | join(", "))})
                 | sort_by((if .Severity == "CRITICAL" then 0 else 1 end), .PkgName, .VulnerabilityID)' \
            results/*.json > findings.json

          {
            echo "*Oppivelvollisuus: tuotannon haavoittuvuudet*"
            echo "Tuotannon commit <$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$PRODUCTION_COMMIT|${PRODUCTION_COMMIT:0:8}>, masterissa $COMMITS_NOT_IN_PRODUCTION committia, joita tuotannossa ei ole."
            echo
            echo "*Critical $(jq '[.[] | select(.Severity == "CRITICAL")] | length' findings.json), high $(jq '[.[] | select(.Severity == "HIGH")] | length' findings.json)* (korjattu versio saatavilla)"
            jq -r '.[] | "• \(.Severity) \(.VulnerabilityID): \(.PkgName) \(.InstalledVersion) → \(.FixedVersion) (\(.images))"' findings.json
          } > message.txt

          jq -n --rawfile text message.txt '{text: $text}' > slack-payload.json

      - name: Send to Slack
        if: github.event_name != 'pull_request'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.PRODUCTION_SCAN_SLACK_WEBHOOK_URL }}
        run: |
          curl --silent --show-error --fail --output /dev/null \
            -H 'Content-Type: application/json' --data @slack-payload.json "$SLACK_WEBHOOK_URL"
