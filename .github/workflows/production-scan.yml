# Findings go only to Slack: run pages, logs and artifacts of a public repository are visible to anyone.
name: Production vulnerability scan
on:
  schedule:
    - cron: "0 5 * * 1" # At 05:00 on Monday
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/production-scan.yml

env:
  AWS_REGION: eu-north-1
  ECR_REGISTRY: 095341522062.dkr.ecr.eu-north-1.amazonaws.com
  TRIVY: aquasec/trivy:0.75.0

permissions:
  id-token: write
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE }}
          role-duration-seconds: 1200

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2
        with:
          mask-password: 'true'

      - name: Scan production and master images
        run: |
          mkdir results
          for repository in service api-gateway frontend; do
            for tag in env-prod master; do
              image="$ECR_REGISTRY/oppivelvollisuus/$repository:$tag"
              docker pull --quiet "$image"
              docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/work" -w /work "$TRIVY" \
                image --scanners vuln --ignore-unfixed --no-progress --quiet --format json --output "results/$tag-$repository.json" "$image"
            done
          done

      - name: Compose Slack message
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          serious_vulnerabilities() {
            jq -s '[.[] | .Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL" or .Severity == "HIGH")
                    | "\(.Severity) \(.VulnerabilityID) \(.PkgName)"] | unique' "$@"
          }
          count() { jq --arg severity "$2" '[.[] | select(startswith($severity + " "))] | length' "$1"; }

          serious_vulnerabilities results/env-prod-*.json > production.json
          serious_vulnerabilities results/master-*.json > master.json
          FIXED_BY_MASTER=$(jq -n --slurpfile p production.json --slurpfile m master.json '$p[0] - $m[0] | length')
          INTRODUCED_BY_MASTER=$(jq -n --slurpfile p production.json --slurpfile m master.json '$m[0] - $p[0] | length')

          PRODUCTION_COMMIT=$(jq -r '.Metadata.ImageConfig.config.Labels["fi.espoo.commit"] // empty' results/env-prod-*.json | sort -u | head -1)
          COMMITS_NOT_IN_PRODUCTION=$(gh api "repos/$GITHUB_REPOSITORY/compare/$PRODUCTION_COMMIT...master" --jq .ahead_by)

          echo "*Oppivelvollisuus* tuotanto: critical $(count production.json CRITICAL), high $(count production.json HIGH) · master: critical $(count master.json CRITICAL), high $(count master.json HIGH) ($COMMITS_NOT_IN_PRODUCTION committia edellä) · masterin vienti korjaisi $FIXED_BY_MASTER, toisi $INTRODUCED_BY_MASTER uutta · <$RUN_URL|ajo>" > message.txt
          jq -n --rawfile text message.txt '{text: $text}' > slack-payload.json

      - name: Send to Slack
        if: github.event_name != 'pull_request'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.PRODUCTION_SCAN_SLACK_WEBHOOK_URL }}
        run: |
          curl --silent --show-error --fail --output /dev/null \
            -H 'Content-Type: application/json' --data @slack-payload.json "$SLACK_WEBHOOK_URL"
