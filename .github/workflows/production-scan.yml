name: Production vulnerability scan
on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/production-scan.yml

env:
  AWS_REGION: eu-north-1
  ECR_REGISTRY: 095341522062.dkr.ecr.eu-north-1.amazonaws.com
  TRIVY: aquasec/trivy:0.75.0

permissions:
  id-token: write
  contents: write
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        repository:
          - service
          - api-gateway
          - frontend

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE }}
          role-duration-seconds: 1200

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2
        with:
          mask-password: 'true'

      - name: Scan production image
        id: scan
        env:
          IMAGE: ${{ env.ECR_REGISTRY }}/oppivelvollisuus/${{ matrix.repository }}:env-prod
        run: |
          docker pull --quiet "$IMAGE"
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/work" -w /work "$TRIVY" \
            image --scanners vuln --ignore-unfixed --no-progress --format json --output result.json "$IMAGE"
          docker run --rm -v "$PWD:/work" -w /work "$TRIVY" \
            convert --format sarif --output result.sarif result.json
          jq --arg repository "${{ matrix.repository }}" '.ArtifactName = $repository' result.json > "${{ matrix.repository }}.json"
          echo "commit=$(jq -r '.Metadata.ImageConfig.config.Labels["fi.espoo.commit"]' result.json)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: scan-${{ matrix.repository }}
          path: ${{ matrix.repository }}.json
          retention-days: 1

      - name: Point production branch to production commit
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ steps.scan.outputs.commit }}
        run: |
          move_branch() { gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/production" -f sha="$COMMIT" -F force=true; }
          create_branch() { gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref=refs/heads/production -f sha="$COMMIT"; }
          move_branch || create_branch || move_branch

      - name: Upload to code scanning
        if: github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: result.sarif
          category: production/${{ matrix.repository }}
          ref: refs/heads/production
          sha: ${{ steps.scan.outputs.commit }}

  summary:
    runs-on: ubuntu-latest
    needs: scan
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: scan-*
          path: results
          merge-multiple: true

      - name: Summary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRODUCTION_COMMIT=$(jq -r '.Metadata.ImageConfig.config.Labels["fi.espoo.commit"] // empty' results/*.json | sort -u | head -1)
          COMMITS_NOT_IN_PRODUCTION=$(gh api "repos/$GITHUB_REPOSITORY/compare/$PRODUCTION_COMMIT...master" --jq .ahead_by)

          jq -s '[.[] | .ArtifactName as $image | .Results[]?.Vulnerabilities[]?
                  | select(.Severity == "CRITICAL" or .Severity == "HIGH")
                  | {Severity, PkgName, InstalledVersion, FixedVersion, VulnerabilityID, image: $image}]
                 | group_by([.Severity, .PkgName, .InstalledVersion, .VulnerabilityID])
                 | map(.[0] + {images: (map(.image) | unique | join(", "))})
                 | sort_by((if .Severity == "CRITICAL" then 0 else 1 end), .PkgName, .VulnerabilityID)' \
            results/*.json > findings.json

          {
            echo "## Production commit $PRODUCTION_COMMIT"
            echo "master has $COMMITS_NOT_IN_PRODUCTION commits that are not in production."
            echo
            echo "**Critical: $(jq '[.[] | select(.Severity == "CRITICAL")] | length' findings.json), High: $(jq '[.[] | select(.Severity == "HIGH")] | length' findings.json)**"
            echo
            echo "| Severity | Package | Installed | Fixed | Vulnerability | Image |"
            echo "|---|---|---|---|---|---|"
            jq -r '.[] | "| \(.Severity) | \(.PkgName) | \(.InstalledVersion) | \(.FixedVersion) | \(.VulnerabilityID) | \(.images) |"' findings.json
          } >> "$GITHUB_STEP_SUMMARY"
